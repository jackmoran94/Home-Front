<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain — Kids Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div>
      <h1>Kids Rota</h1>
      <div class="sub">Generated automatically from your two templates</div>
    </div>
  </header>

  <div class="card" style="display:flex;gap:8px;align-items:center;justify-content:space-between;">
    <button class="btn-ghost" id="prevBtn">&larr; Previous 14</button>
    <span id="rangeLabel" style="font-size:12px;color:var(--ink-soft);"></span>
    <button class="btn-ghost" id="nextBtn">Next 14 &rarr;</button>
  </div>

  <div id="rotaList"><div class="empty-state">Loading…</div></div>
</div>

<script src="/js/shared.js"></script>
<script>
let offset = 0; // in units of 14 days from today

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

async function loadRota() {
  const today = new Date().toISOString().slice(0, 10);
  const start = addDays(today, offset * 14);
  const data = await api(`/api/rota?start=${start}&days=14`);
  if (!data) return;

  document.getElementById('rangeLabel').textContent = `${fmtDate(data.days[0].date)} – ${fmtDate(data.days[data.days.length - 1].date)}`;

  const listEl = document.getElementById('rotaList');
  listEl.innerHTML = data.days.map(d => {
    if (d.beforeAnchor) {
      return `<div class="rota-day"><div class="rd-date">${fmtDate(d.date)}</div><div class="rd-shift">Rota not started yet</div></div>`;
    }
    return `
      <div class="rota-day ${d.kids ? 'kids' : 'nokids'}">
        <div>
          <div class="rd-date">${fmtDate(d.date)}</div>
          <div class="rd-shift">${escapeHtml(d.shift)}</div>
        </div>
        <div class="rd-kids">${d.kids ? 'KIDS' : 'OFF'}</div>
      </div>`;
  }).join('');
}

(async function init() {
  await requireAuth();
  renderNav('/rota.html');
  document.getElementById('prevBtn').addEventListener('click', () => { offset -= 1; loadRota(); });
  document.getElementById('nextBtn').addEventListener('click', () => { offset += 1; loadRota(); });
  loadRota();
})();
</script>
</body>
</html>
